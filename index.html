<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>PRISM · PHILRADS</title>
    <meta name="description" content="PRISM: Response, Inventory and Staff Management for Philippine Relief and Development Services, Inc. (PHILRADS)." />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1c1d21" />
    <script>
      // Light or dark, as chosen in Profile (src/lib/theme.ts), set before the page draws.
      try {
        var t = localStorage.getItem('philrads.theme');
        if (t === 'system') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        if (t === 'light') {
          document.documentElement.dataset.theme = 'light';
          document.querySelector('meta[name=theme-color]').setAttribute('content', '#e6e6ea');
        }
      } catch (e) {}
    </script>
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/svg+xml" href="/brand/prism-favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PRISM" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=EB+Garamond:ital@0;1&family=Montserrat:wght@400;500;600;700;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>PRISM needs JavaScript to run.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
